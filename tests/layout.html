<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>笔记布局检查</title>
<style>body{margin:0;background:#dde4df;font:14px/1.5 system-ui,sans-serif;color:#274333}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button{font:inherit;padding:7px}iframe{display:block;border:1px solid #899f91;margin:0 auto;background:white;height:82vh;max-width:100%}output{padding:10px;display:block}label{display:flex;gap:7px;align-items:center}</style></head>
<body><header><label>窗口宽度<select id="width"><option>390</option><option>360</option><option>760</option><option>1200</option></select></label><label>章节<select id="chapter"></select></label><label>演示<select id="note"></select></label><button id="open">打开并定位演示</button><button id="measure">测量溢出</button><button id="audit">检查本章全部卡片</button><button id="audit-all">检查11章两种手机宽度</button></header><iframe id="preview" title="窄屏笔记预览" width="390"></iframe><output id="result" aria-live="polite"></output>
<script src="./layout-geometry.js"></script>
<script>
const frame=document.getElementById('preview'),width=document.getElementById('width'),chapter=document.getElementById('chapter'),note=document.getElementById('note');
chapter.innerHTML='<option value="0">首页</option>'+Array.from({length:11},(_,i)=>`<option value="${i+1}">第${i+1}章</option>`).join('');
chapter.value='4';
let frameLoaded=false;
function load(){frameLoaded=false;frame.src=chapter.value==='0'?`../index.html?preview=${Date.now()}`:`../chapter${chapter.value}.html?preview=${Date.now()}`;}
chapter.onchange=load;width.onchange=()=>frame.width=width.value;
frame.onload=()=>{frameLoaded=true;note.innerHTML=[...frame.contentDocument.querySelectorAll('.note-item')].map(n=>`<option value="${n.id}">${n.querySelector('h3').textContent}</option>`).join('');};
function chapterDocument(){
 const d=frame.contentDocument;
 if(chapter.value==='0')throw new Error('首页没有演示卡片，请选择章节。');
 if(!frameLoaded||d?.body?.dataset.chapter!==chapter.value||!d.querySelector('.note-item'))throw new Error('章节尚未加载完成，请稍后重试；本次不计为通过。');
 return d;
}
const checked=action=>async()=>{try{await action();}catch(error){document.getElementById('result').textContent='检查中断：'+error.message;}};
document.getElementById('open').onclick=checked(()=>{const c=chapterDocument().getElementById(note.value);if(!c)return;const b=c.querySelector('.simulation-toggle');if(b.getAttribute('aria-expanded')==='false')b.click();b.scrollIntoView({block:'start'});});
document.getElementById('measure').onclick=checked(()=>{const d=chapterDocument();const c=d.getElementById(note.value);const r=c.querySelector('.reality-demo').getBoundingClientRect();document.getElementById('result').textContent=`视口 ${d.documentElement.clientWidth}px / 文档 ${d.documentElement.scrollWidth}px / 卡片 ${Math.round(r.width)}px；正文横向溢出 ${Math.max(0,d.documentElement.scrollWidth-d.documentElement.clientWidth)}px`;});
async function auditChapter(){
 const d=chapterDocument(),w=frame.contentWindow,cards=[...d.querySelectorAll('.note-item')],issues=[];
 for(const c of cards){
  const toggle=c.querySelector('.simulation-toggle'),wasOpen=toggle.getAttribute('aria-expanded')==='true';if(!wasOpen)toggle.click();
  // getBoundingClientRect below flushes layout; a background-frame RAF can be throttled.
  const clipped=[...c.querySelectorAll('h3,h4,h5,h6,p,li,button,label,output,select,input,textarea,pre,th,td')].filter(el=>{
   if(el.closest('[hidden]'))return false;
   return NOTE_LAYOUT_GEOMETRY.clippedByAncestor(el,node=>w.getComputedStyle(node));
  }).map(el=>(el.textContent||el.getAttribute('aria-label')||'').trim().slice(0,65));
  if(clipped.length)issues.push({id:c.id,clipped});if(!wasOpen)toggle.click();
 }
 return {chapter:chapter.value,frameWidth:Number(width.value),width:d.documentElement.clientWidth,cards:cards.length,overflow:Math.max(0,d.documentElement.scrollWidth-d.documentElement.clientWidth),issues};
}
document.getElementById('audit').onclick=checked(async()=>{document.getElementById('result').textContent=JSON.stringify(await auditChapter(),null,2);});
document.getElementById('audit-all').onclick=async()=>{
 const buttons=[...document.querySelectorAll('header button,header select')],results=[],result=document.getElementById('result');buttons.forEach(b=>b.disabled=true);
 try{
  for(const size of [360,390])for(let ch=1;ch<=11;ch++){
   width.value=String(size);frame.width=size;chapter.value=String(ch);
   result.textContent=`正在检查第${ch}章，预览框${size}px…`;
   const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));load();await loaded;
   results.push(await auditChapter());
  }
  result.textContent=JSON.stringify({complete:true,results},null,2);
 }catch(error){result.textContent='检查中断：'+error.message;}finally{buttons.forEach(b=>b.disabled=false);}
};
load();
</script></body></html>
